name: CI

on:
    push:
      branches: [main]
    pull_request:
      branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
      name: Run tests
      runs-on: ubuntu-latest

      steps:
        - name: Get the code
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.9"

        - name: Install test tools
          run: python -m pip install -r requirements-dev.txt

        - name: Run automated tests
          run: python -m pytest
