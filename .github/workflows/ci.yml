name: CI

on:
    push:
      branches: [main]
    pull_request:
      branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
      name: Run tests
      runs-on: ubuntu-latest

      steps:
        - name: Get the code
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.9"

        - name: Install test tools
          run: python -m pip install -r requirements-dev.txt

        - name: Run automated tests
          run: python -m pytest

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "17"

        - name: Install JMeter
          run: |
            curl -sSL -o jmeter.tgz https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
            tar -xzf jmeter.tgz
            echo "$PWD/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

        - name: Run JMeter load test
          run: |
            python -m src.app &
            APP_PID=$!
            for i in $(seq 1 10); do
              curl -sf "http://localhost:8000/greet?name=Rahul" > /dev/null && break
              sleep 1
            done
            jmeter -n -t jmeter/greet-test.jmx -l jmeter/results.jtl
            kill "$APP_PID"
            if grep -q ",false," jmeter/results.jtl; then
              echo "JMeter reported a failed request"
              exit 1
            fi
